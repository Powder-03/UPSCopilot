name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      # Offline suite only: tests marked `bedrock` need live AWS credentials and are
      # deselected in CI. Run them locally with: uv run pytest --run-bedrock
      - name: Pytest (offline)
        run: uv run pytest -m "not bedrock" -q
