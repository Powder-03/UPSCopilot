AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UPSC Evaluator - Production Decoupled Serverless Architecture on AWS Lambda, S3, DynamoDB, and SQS.

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: "Google Gemini API Key for Vertex AI LLM and Vision OCR"
  GcpProjectId:
    Type: String
    Description: "Google Cloud Project ID where Vertex AI is enabled"
    Default: "project-1b52589d-0827-46ab-9be"
  EmailProvider:
    Type: String
    Description: "Email delivery provider: 'google', 'smtp', 'ses', or 'mock'"
    Default: "google"
    AllowedValues:
      - "google"
      - "smtp"
      - "ses"
      - "mock"
  SmtpHost:
    Type: String
    Description: "SMTP Server Host (e.g. smtp.gmail.com)"
    Default: "smtp.gmail.com"
  SmtpPort:
    Type: String
    Description: "SMTP Server Port (587 for STARTTLS, 465 for SSL)"
    Default: "587"
  SmtpUser:
    Type: String
    Description: "Google / Gmail Account Email for SMTP authentication"
    Default: "yujitodoyuta@gmail.com"
  SmtpPassword:
    Type: String
    NoEcho: true
    Description: "Google 16-character App Password for SMTP authentication"
    Default: ""
  MailFromName:
    Type: String
    Description: "Friendly Sender Name for Scorecard Emails"
    Default: "UPSC Evaluator"
  SesFromEmail:
    Type: String
    Description: "Verified Amazon SES Sender Email"
    Default: "yujitodoyuta@gmail.com"
  PineconeApiKey:
    Type: String
    NoEcho: true
    Description: "Pinecone API Key for Cloud Knowledge Base Retrieval"
  PineconeIndexName:
    Type: String
    Description: "Pinecone Index Name"
    Default: "upsc-kb"
  LangSmithTracing:
    Type: String
    Description: "Enable LangSmith end-to-end tracing"
    Default: "true"
  LangSmithApiKey:
    Type: String
    NoEcho: true
    Description: "LangSmith API Key"
    Default: ""
  LangSmithProject:
    Type: String
    Description: "LangSmith Project Name"
    Default: "UPSCopilot"

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        LLM_PROVIDER: "vertex"
        GEMINI_API_KEY: !Ref GeminiApiKey
        GCP_PROJECT_ID: !Ref GcpProjectId
        PINECONE_API_KEY: !Ref PineconeApiKey
        PINECONE_INDEX_NAME: !Ref PineconeIndexName
        EMBEDDING_DIMENSION: "768"
        LANGSMITH_TRACING: !Ref LangSmithTracing
        LANGSMITH_API_KEY: !Ref LangSmithApiKey
        LANGSMITH_PROJECT: !Ref LangSmithProject
        LANGCHAIN_TRACING_V2: !Ref LangSmithTracing
        LANGCHAIN_API_KEY: !Ref LangSmithApiKey
        LANGCHAIN_PROJECT: !Ref LangSmithProject
        S3_BUCKET: !Ref UploadsBucket
        DYNAMODB_TABLE: !Ref JobStateTable
        EVAL_QUEUE_URL: !Ref EvaluationQueue
        QUEUE_URL: !Ref EvaluationQueue
        EVAL_LAMBDA_FUNCTION_NAME: !Sub "${AWS::StackName}-single-question-eval"
        EMAIL_PROVIDER: !Ref EmailProvider
        SMTP_HOST: !Ref SmtpHost
        SMTP_PORT: !Ref SmtpPort
        SMTP_USER: !Ref SmtpUser
        SMTP_PASSWORD: !Ref SmtpPassword
        MAIL_FROM_NAME: !Ref MailFromName
        SES_FROM_EMAIL: !Ref SesFromEmail

Resources:
  # =================================================================
  # Storage & State Resources
  # =================================================================
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AutoCleanUploadsAfter1Day
            Status: Enabled
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  JobStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-job-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # =================================================================
  # Evaluation SQS Queue + DLQ (Coordinator & Job Buffer)
  # =================================================================
  EvaluationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-eval-dlq"
      MessageRetentionPeriod: 1209600 # 14 days

  EvaluationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-eval-queue"
      VisibilityTimeout: 300 # 5 minutes for EC2 coordinator evaluation cycle
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EvaluationDeadLetterQueue.Arn
        maxReceiveCount: 3

  # =================================================================
  # API Lambda (FastAPI via Mangum + API Gateway)
  # =================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["src.handlers.api.handler"]
      Timeout: 29
      MemorySize: 2048
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EvaluationQueue.QueueName
      Events:
        ApiGateway:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # =================================================================
  # Single-Question Evaluation Lambda (Fan-Out Micro-Worker)
  # =================================================================
  SingleQuestionEvalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-single-question-eval"
      PackageType: Image
      ImageConfig:
        Command: ["src.handlers.single_question_eval.handler"]
      MemorySize: 1024
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

# =================================================================
# Outputs
# =================================================================
Outputs:
  ApiUrl:
    Description: "HTTP API Gateway URL for UPSC Evaluator"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  S3BucketName:
    Description: "S3 Bucket for PDF Uploads"
    Value: !Ref UploadsBucket
  JobStateTableName:
    Description: "DynamoDB Table for Job State Tracking"
    Value: !Ref JobStateTable
  EvaluationQueueUrl:
    Description: "SQS Queue URL for Coordinator Evaluation Jobs"
    Value: !Ref EvaluationQueue
  SingleQuestionEvalFunctionName:
    Description: "Function Name for Single-Question Parallel Evaluator"
    Value: !Ref SingleQuestionEvalFunction
