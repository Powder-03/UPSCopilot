AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UPSC Evaluator - Production Decoupled Serverless Architecture on AWS Lambda, S3, DynamoDB, and SQS.

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: "Google Gemini API Key for Vertex AI LLM and Vision OCR"
  GcpProjectId:
    Type: String
    Description: "Google Cloud Project ID where Vertex AI is enabled"
    Default: "project-1b52589d-0827-46ab-9be"
  EmailProvider:
    Type: String
    Description: "Email delivery provider: 'ses' or 'mock'"
    Default: "ses"
    AllowedValues:
      - "ses"
      - "mock"
  SesFromEmail:
    Type: String
    Description: "Verified Amazon SES Sender Email"
    Default: "yujitodoyuta@gmail.com"
  PineconeApiKey:
    Type: String
    NoEcho: true
    Description: "Pinecone API Key for Cloud Knowledge Base Retrieval"
  PineconeIndexName:
    Type: String
    Description: "Pinecone Index Name"
    Default: "upsc-kb"
  LangSmithTracing:
    Type: String
    Description: "Enable LangSmith end-to-end tracing"
    Default: "true"
  LangSmithApiKey:
    Type: String
    NoEcho: true
    Description: "LangSmith API Key"
    Default: ""
  LangSmithProject:
    Type: String
    Description: "LangSmith Project Name"
    Default: "UPSCopilot"

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        LLM_PROVIDER: "vertex"
        GEMINI_API_KEY: !Ref GeminiApiKey
        GCP_PROJECT_ID: !Ref GcpProjectId
        PINECONE_API_KEY: !Ref PineconeApiKey
        PINECONE_INDEX_NAME: !Ref PineconeIndexName
        EMBEDDING_DIMENSION: "768"
        LANGSMITH_TRACING: !Ref LangSmithTracing
        LANGSMITH_API_KEY: !Ref LangSmithApiKey
        LANGSMITH_PROJECT: !Ref LangSmithProject
        LANGCHAIN_TRACING_V2: !Ref LangSmithTracing
        LANGCHAIN_API_KEY: !Ref LangSmithApiKey
        LANGCHAIN_PROJECT: !Ref LangSmithProject
        S3_BUCKET: !Ref UploadsBucket
        DYNAMODB_TABLE: !Ref JobStateTable
        PARSED_BOOKLETS_TABLE: !Ref ParsedBookletsTable
        VISION_QUEUE_URL: !Ref VisionQueue
        EVAL_QUEUE_URL: !Ref EvaluationQueue
        EMAIL_PROVIDER: !Ref EmailProvider
        SES_FROM_EMAIL: !Ref SesFromEmail

Resources:
  # =================================================================
  # Storage & State Resources
  # =================================================================
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  JobStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-job-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  ParsedBookletsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-parsed-booklets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  # =================================================================
  # Stage 1: Vision SQS Queue + DLQ
  # =================================================================
  VisionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-vision-dlq"
      MessageRetentionPeriod: 1209600 # 14 days

  VisionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-vision-queue"
      VisibilityTimeout: 660 # Exceeds vision worker timeout (10 min = 600s)
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VisionDeadLetterQueue.Arn
        maxReceiveCount: 3

  # =================================================================
  # Stage 2: Evaluation SQS Queue + DLQ
  # =================================================================
  EvaluationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-eval-dlq"
      MessageRetentionPeriod: 1209600 # 14 days

  EvaluationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-eval-queue"
      VisibilityTimeout: 960 # Exceeds eval worker timeout (15 min = 900s)
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EvaluationDeadLetterQueue.Arn
        maxReceiveCount: 3

  # =================================================================
  # API Lambda (FastAPI via Mangum + API Gateway)
  # =================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["src.lambda_api.handler"]
      Timeout: 29
      MemorySize: 2048
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VisionQueue.QueueName
      Events:
        ApiGateway:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # =================================================================
  # Stage 1 Worker Lambda: Vision OCR (PyMuPDF + Multimodal Vision)
  # =================================================================
  VisionWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["src.lambda_vision.handler"]
      Timeout: 600 # 10 minutes for multi-page OCR transcription
      MemorySize: 3008 # Max allowable within standard 3008 MB account tier
      EphemeralStorage:
        Size: 2048 # 2 GB /tmp storage for downloading and parsing PDFs
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ParsedBookletsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt VisionQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EvaluationQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VisionQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # =================================================================
  # Stage 2 Worker Lambda: Evaluation Engine (RAG + 2-Call LLM + PDF + SES)
  # =================================================================
  EvalWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["src.lambda_eval.handler"]
      Timeout: 900 # 15 minutes max execution
      MemorySize: 3008 # Max allowable within standard 3008 MB account tier
      EphemeralStorage:
        Size: 2048 # 2 GB /tmp storage for PDF rendering
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ParsedBookletsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt EvaluationQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EvaluationQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

# =================================================================
# Outputs
# =================================================================
Outputs:
  ApiUrl:
    Description: "HTTP API Gateway URL for UPSC Evaluator"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  S3BucketName:
    Description: "S3 Bucket for PDF Uploads"
    Value: !Ref UploadsBucket
  JobStateTableName:
    Description: "DynamoDB Table for Job State Tracking"
    Value: !Ref JobStateTable
  ParsedBookletsTableName:
    Description: "DynamoDB Table for Parsed Transcripts"
    Value: !Ref ParsedBookletsTable
  VisionQueueUrl:
    Description: "SQS Queue URL for Vision OCR Stage"
    Value: !Ref VisionQueue
  EvaluationQueueUrl:
    Description: "SQS Queue URL for Evaluation Engine Stage"
    Value: !Ref EvaluationQueue
