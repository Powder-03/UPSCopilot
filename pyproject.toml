[project]
name = "upsc-evaluator"
version = "0.1.0"
description = "Calibrated UPSC Mains Answer Evaluator with DeepEval and Grounded RAG Knowledge Base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0,<2.0.0",
    "rich>=13.7.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-aws>=0.1.0",
    "langchain-community>=0.2.0",
    "pinecone>=5.0.0",
    "langgraph>=0.1.0",
    "pywin32>=312; sys_platform == 'win32'",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    "google-genai>=1.0.0",
    "mangum>=0.17.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "bedrock: tests that require live AWS Bedrock credentials (deselect with '-m \"not bedrock\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: pyupgrade, B: bugbear (mutable defaults etc.)
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default argument (settings singletons are intentional)
    "UP042", # keep (str, Enum) idiom; StrEnum migration deferred
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["I001"]  # scripts keep hand-ordered imports for readability

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "deepeval>=4.2.6",
]
