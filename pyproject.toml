[project]
name = "upsc-evaluator"
version = "0.1.0"
description = "Calibrated UPSC Mains Answer Evaluator with DeepEval and Grounded RAG Knowledge Base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-aws>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langgraph>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
